name: self-checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the decision logic (SD-202 timers, drowsiness level, escalation, scoring) is pure Python: no install needed
      - run: |
          python src/dms_core.py
          python src/drowsiness.py
          python src/escalation.py
          cd src && python evaluate.py
