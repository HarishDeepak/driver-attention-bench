# Sensor rig for CARLA's carla_cosmos_gen.py: three control channels, 720p, camera at the ego (rig copied from CARLA's cosmos_aov.yaml, resolution reduced for 6 GB VRAM)
- sensor: rgb
  attributes: {image_size_x: 1280, image_size_y: 720, fov: 110}
  transform: {location: {x: 0, y: 0, z: 1.8}, rotation: {pitch: 8, yaw: 0, roll: 0}}
- sensor: depth
  attributes: {image_size_x: 1280, image_size_y: 720, fov: 110}
  transform: {location: {x: 0, y: 0, z: 1.8}, rotation: {pitch: 8, yaw: 0, roll: 0}}
- sensor: semantic_segmentation
  attributes: {image_size_x: 1280, image_size_y: 720, fov: 110}
  transform: {location: {x: 0, y: 0, z: 1.8}, rotation: {pitch: 8, yaw: 0, roll: 0}}
